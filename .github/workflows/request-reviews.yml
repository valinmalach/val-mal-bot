name: Request reviews

# Sourcery reviews a PR when it opens and only re-reviews in part after. A draft is
# skipped, so `ready_for_review` asks for one that has just been marked ready, and
# `reopened` does the same for a PR brought back from closed.
# pull_request_target, so the workflow holding the token is master's, not one a PR
# rewrote. Safe only while nothing here checks out or runs the PR's code.
on:
  pull_request_target:
    types: [synchronize, ready_for_review, reopened]

# The token below does the work, so GITHUB_TOKEN gets nothing.
permissions: {}

jobs:
  sourcery:
    # Sourcery does its own full review on open, and skips drafts.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      # Only whether the secret exists, never the secret. A Dependabot run gets no
      # Actions secrets and skips the step; a token that exists but is rejected still
      # fails it, which is how a revoked one gets noticed.
      HAS_SOURCERY_TOKEN: ${{ secrets.SOURCERY_TRIGGER_TOKEN != '' }}
    steps:
      - if: ${{ env.HAS_SOURCERY_TOKEN == 'true' }}
        run: gh pr comment "$PR" --repo "$REPO" --body "@sourcery-ai review"
        env:
          GH_TOKEN: ${{ secrets.SOURCERY_TRIGGER_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

