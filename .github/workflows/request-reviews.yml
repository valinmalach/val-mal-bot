name: Request reviews

# Sourcery reviews a PR when it opens and only re-reviews in part after. Codacy says
# it requested a first review on open and posts nothing until it is triggered, so it
# is asked on open too.
on:
  pull_request:
    types: [opened, synchronize]

# The tokens below do the work, so GITHUB_TOKEN gets nothing.
permissions: {}

jobs:
  sourcery:
    # Sourcery does its own full review on open, and skips drafts.
    if: ${{ github.event.action == 'synchronize' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      # Only whether the secret exists, never the secret. A fork or a Dependabot run
      # gets no secrets and skips the step; a token that exists but is rejected still
      # fails it, which is how a revoked one gets noticed.
      HAS_SOURCERY_TOKEN: ${{ secrets.SOURCERY_TRIGGER_TOKEN != '' }}
    steps:
      - if: ${{ env.HAS_SOURCERY_TOKEN == 'true' }}
        run: gh pr comment "$PR" --repo "$REPO" --body "@sourcery-ai review"
        env:
          GH_TOKEN: ${{ secrets.SOURCERY_TRIGGER_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

  codacy:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_API_TOKEN != '' }}
    steps:
      # Not retried: a trigger Codacy accepted whose reply was lost would be sent
      # twice, and each one is a review. The first real run answered 2xx within a
      # second, before Codacy had started analysing the commit.
      - if: ${{ env.HAS_CODACY_TOKEN == 'true' }}
        run: >
          curl -fsS -X POST -H "api-token: $CODACY_API_TOKEN"
          "https://api.codacy.com/api/v3/analysis/organizations/gh/$OWNER/repositories/$NAME/pull-requests/$PR/ai-reviewer/trigger"
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
