name: Coverage

# Every push, not just master: Codacy needs coverage for a PR's head commit and for
# the commit it branched from, and a `pull_request` run reports a merge commit that
# neither of those is.
on: push

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      # Empty on a fork or a Dependabot run, which get no secrets; the upload is
      # skipped there rather than failing the tests that just passed.
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so the patch is pinned.
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=xml
      - name: Upload coverage to Codacy
        if: ${{ env.CODACY_PROJECT_TOKEN != '' }}
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml
