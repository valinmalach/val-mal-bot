# Local Postgres for development, and the one CI applies the migrations to. The bot
# itself runs on the host, so a code change only needs a restart rather than an image
# rebuild.
services:
  postgres:
    # The major version production runs. Pinned by digest, for the reason the actions in
    # .github/workflows are pinned to commits: a tag can be moved. The tag stays so a
    # reader can see what it is. To take a newer 18.x, pull it and use the digest that
    # `docker image inspect postgres:18-alpine --format "{{index .RepoDigests 0}}"` prints.
    image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
    environment:
      POSTGRES_USER: valmal
      POSTGRES_PASSWORD: valmal
      POSTGRES_DB: valmal
    ports:
      # Loopback only. A bare "5432:5432" publishes the database on every network
      # interface, and its password is in .env.example.
      - "127.0.0.1:5432:5432"
    volumes:
      # 18 and later keep the cluster in a versioned directory under this path, so it is
      # the parent that is mounted. The volume an older image used holds its data in a
      # `data` directory, which 18 does not read.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valmal -d valmal"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
