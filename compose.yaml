# Local Postgres for development. The bot itself runs on the host, so a code
# change only needs a restart rather than an image rebuild.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: valmal
      POSTGRES_PASSWORD: valmal
      POSTGRES_DB: valmal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valmal -d valmal"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
