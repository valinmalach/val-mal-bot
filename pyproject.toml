[project]
name = "val-mal-bot"
version = "1.0.0"
description = "Valin Malach's bot for Twitch/Discord"
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
    # discord.py sends on aiohttp; live_alert names its errors directly, so it is
    # declared here rather than leaned on transitively.
    "aiohttp>=3.14.3",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "discord>=2.3.2",
    "fastapi>=0.141.1",
    "httpx[http2]>=0.28.1",
    "pendulum>=3.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.53.0",
]

[tool.pyright]
# Pylance reads this section, so the editor and CLI pyright agree. "standard" is
# Pylance's own default, pinned so a future change cannot move the goalposts.
typeCheckingMode = "standard"

# No exclude key: setting it REPLACES pyright's defaults instead of adding to
# them, and those already cover .venv and __pycache__. "M.m" only, and required.
pythonVersion = "3.14"
# The webhook dispatcher is generic in its model, which binds a route to its
# handler only as strongly as the handler annotates its own parameter. Without
# this an unannotated handler is Any and pairs with anything.
reportMissingParameterType = "error"
venvPath = "."
venv = ".venv"

# Pylance greys these out; the CLI is silent unless they are promoted.
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedExpression = "warning"
reportUnreachable = "warning"
reportDeprecated = "warning"

[tool.ruff]
# Stated rather than inferred from requires-python: a Ruff that does not read this
# file (Codacy's generated config, for one) lints as an older Python and reports F821
# on a class annotating itself, which PEP 649 makes correct.
target-version = "py314"

[tool.ruff.lint]
# select REPLACES Ruff's defaults, so the default F/E4/E7/E9 are listed. F, B, S and
# ANN are the families Verity's Standard names; BLE is what every `# noqa: BLE001` in
# the code already assumes; I, SIM, UP, RUF and C90 the code already satisfies.
select = [
    "F", "E4", "E7", "E9",
    "B", "BLE", "RUF", "I", "SIM", "S", "C90", "ANN", "UP",
]
ignore = [
    # Any is deliberate where the value is generic: the config accessors, format
    # kwargs and the Alembic hooks.
    "ANN401",
    # A StrEnum formats and str()s as its value; these (str, Enum) classes do not.
    "UP042",
]

[tool.ruff.lint.mccabe]
# Verity's Standard: complexity <= 15.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# _demo is a runnable self-check, and its asserts are the point.
"logging_json.py" = ["S101"]
# A test is an assert, and its credentials are made up.
"tests/*" = ["S101", "S105", "S106"]

[tool.pylint.main]
py-version = "3.14"

[tool.pylint.messages_control]
# The bug detectors tuned on Codacy Cloud (PyLintPython3_*), so a local pylint and Cloud
# agree, minus not-callable: SQLAlchemy's generated func.now() trips it once the .venv is
# importable, which is exactly when an editor runs it. Docstring, naming and design-size
# messages stay off by convention (AGENTS.md).
disable = ["all"]
enable = [
    "abstract-class-instantiated", "access-member-before-definition",
    "arguments-differ", "assert-on-tuple", "assignment-from-no-return",
    "bad-except-order", "bad-format-character", "bad-format-string",
    "bad-format-string-key", "bad-super-call", "bare-except", "binary-op-exception",
    "catching-non-exception", "dangerous-default-value", "duplicate-argument-name",
    "duplicate-bases", "duplicate-except", "duplicate-key", "eval-used",
    "exec-used", "expression-not-assigned", "format-combined-specification",
    "format-needs-mapping", "function-redefined", "global-variable-undefined",
    "inconsistent-mro", "inherit-non-class", "init-is-generator",
    "invalid-all-object", "invalid-format-index", "invalid-sequence-index",
    "invalid-slice-index", "invalid-slots", "invalid-slots-object",
    "invalid-star-assignment-target", "logging-format-truncated",
    "logging-too-few-args", "logging-too-many-args", "logging-unsupported-format",
    "lost-exception", "method-hidden", "misplaced-bare-raise", "misplaced-future",
    "missing-format-argument-key", "missing-format-attribute",
    "missing-format-string-key", "missing-kwoa", "mixed-format-string",
    "no-method-argument", "no-value-for-parameter", "non-iterator-returned",
    "non-parent-init-called", "nonexistent-operator", "nonlocal-and-global",
    "nonlocal-without-binding", "not-in-loop", "notimplemented-raised",
    "raising-bad-type", "raising-non-exception", "redefined-builtin",
    "redundant-keyword-arg", "repeated-keyword", "return-arg-in-generator",
    "return-in-init", "return-outside-function", "signature-differs",
    "star-needs-assignment-target", "too-few-format-args", "too-many-format-args",
    "too-many-function-args", "too-many-star-expressions",
    "truncated-format-string", "undefined-all-variable", "unexpected-keyword-arg",
    "unexpected-special-method-signature", "unreachable",
    "unused-format-string-key", "used-before-assignment", "yield-outside-function"
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.bandit.assert_used]
# logging_json._demo is a runnable self-check; its asserts are the point.
skips = ["*/logging_json.py", "*/tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The modules live at the repo root, and nothing is installed as a package.
pythonpath = ["."]
# A misspelt marker is a test that silently runs unmarked.
addopts = "--strict-markers"
# No test takes more than a second, so a longer one is stuck: an awaited event nobody
# sets. On Linux this fails that test. On Windows pytest-timeout can only dump the
# stacks and end the process, which names the hang and still stops the run.
timeout = 60
filterwarnings = [
    # A coroutine nobody awaited is a call that silently did nothing, which is
    # the failure most likely to hide in code that fires tasks and forgets them.
    # The warning is raised while the coroutine is being collected, so pytest
    # reports it as an unraisable exception rather than as a RuntimeWarning, and
    # only the second line turns it into a failure.
    "error::RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    # discord.py's own use of a function Python 3.16 removes; nothing here can fix it.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:discord",
    # discord.utils passes re.sub's count positionally, which Python 3.13 deprecates.
    "ignore:'count' is passed as positional argument:DeprecationWarning:discord",
]

[tool.coverage.run]
source = ["."]
branch = true
# Migrations are seeded configuration and run against a database; the tests
# themselves would only measure themselves. .verity holds generated copies of the
# tests, which counted twice and were never run; .codacy is tooling, not the bot;
# .claude holds agent worktrees, each a whole copy of the repo with its own .venv.
omit = [
    ".venv/*",
    "**/.venv/**",
    "tests/*",
    "migrations/*",
    ".verity/*",
    ".codacy/*",
    ".claude/**",
]

[tool.coverage.report]
# cogs/ and services/twitch/ have no __init__.py, and without this an untested file
# in them is left out of the total instead of counting as 0%.
include_namespace_packages = true
show_missing = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
]
